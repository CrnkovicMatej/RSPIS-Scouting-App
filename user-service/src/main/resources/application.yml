spring.application.name: user-service
server:
  port: 8082
spring:
  jpa:
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:user-service
    hikari:
      driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

